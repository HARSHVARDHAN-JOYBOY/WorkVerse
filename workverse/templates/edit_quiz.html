{% extends "base.html" %}

{% block title %}Edit Quiz Question - Admin - WorkVerse{% endblock %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('admin_dashboard') }}">Admin Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('manage_simulations') }}">Simulations</a></li>
            <li class="breadcrumb-item active">Edit Quiz Question</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i> Edit Quiz Question
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('edit_quiz_question', quiz_id=quiz.id) }}">
                        <div class="mb-3">
                            <label for="question" class="form-label">Question *</label>
                            <textarea class="form-control" name="question" id="question" rows="3" required>{{ quiz.question }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="option1" class="form-label">Option 1 *</label>
                            <input type="text" class="form-control" name="option1" id="option1" value="{{ quiz.option1 }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="option2" class="form-label">Option 2 *</label>
                            <input type="text" class="form-control" name="option2" id="option2" value="{{ quiz.option2 }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="option3" class="form-label">Option 3 *</label>
                            <input type="text" class="form-control" name="option3" id="option3" value="{{ quiz.option3 }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="option4" class="form-label">Option 4 *</label>
                            <input type="text" class="form-control" name="option4" id="option4" value="{{ quiz.option4 }}" required>
                        </div>

                        <div class="mb-4">
                            <label for="correct_answer" class="form-label">Correct Answer *</label>
                            <select class="form-select" name="correct_answer" id="correct_answer" required>
                                <option value="1" {% if quiz.correct_answer == '1' %}selected{% endif %}>Option 1</option>
                                <option value="2" {% if quiz.correct_answer == '2' %}selected{% endif %}>Option 2</option>
                                <option value="3" {% if quiz.correct_answer == '3' %}selected{% endif %}>Option 3</option>
                                <option value="4" {% if quiz.correct_answer == '4' %}selected{% endif %}>Option 4</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Save Changes
                            </button>
                            <a href="{{ url_for('manage_quizzes', simulation_id=quiz.simulation_id) }}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

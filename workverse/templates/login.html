{% extends "base.html" %}

{% block title %}Login - WorkVerse{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
                        <h2 class="mt-3">Welcome Back</h2>
                        <p class="text-muted">Login to continue your learning journey</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" 
                                   placeholder="your@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" 
                                   placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>

                        <div class="text-center">
                            <p class="text-muted mb-0">
                                Don't have an account? 
                                <a href="{{ url_for('register') }}" class="text-primary fw-bold">Register here</a>
                            </p>
                        </div>
                    </form>

                    <!-- Admin Login Info -->
                    <div class="mt-4 p-3 bg-light rounded">
                        <p class="small mb-1"><strong>Admin Login:</strong></p>
                        <p class="small mb-0">Email: admin@workverse.com</p>
                        <p class="small mb-0">Password: admin123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
